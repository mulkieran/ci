---
name: ci repo CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

  workflow_dispatch:

jobs:
  python-checks:
    strategy:
      matrix:
        include:
          # MANDATORY CHECKS USING CURRENT DEVELOPMENT INTERPRETER
          - dependencies: >
              libatomic
              python3-dbus
              python3-dbus-python-client-gen
              python3-matplotlib
              python3-numpy
              python3-pygithub
              python3-requests
              python3-semantic_version
              python3-specfile
              ruff
            task: PATH=${PATH}:/github/home/.local/bin make -f Makefile lint
          - dependencies: >
              ruff
              shfmt
            task: make -f Makefile fmt-travis
          - dependencies: >
              findutils
              ShellCheck
            task: make -f Makefile shellcheck
    runs-on: ubuntu-latest
    container: fedora:44  # CURRENT DEVELOPMENT ENVIRONMENT
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install dependencies
        run: >
          dnf install -y
          make
          pip
          ${{ matrix.dependencies }}
      - name: Install pyright
        run: pip install --user pyright
      - name: Run test
        run: ${{ matrix.task }}

  general_checks:
    uses: stratis-storage/github-actions/.github/workflows/reusable_general.yml@master
    with:
      fedora-container-image-number: 44  # CURRENT DEVELOPMENT ENVIRONMENT
